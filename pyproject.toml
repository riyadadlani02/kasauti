[project]
name = "kasauti"
version = "0.1.0"
description = "Router divergence diagnostic for quantized MoE checkpoints"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.40"]

[project.scripts]
kasauti = "kasauti:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kasauti"]
